name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --name "雪绒的钢铁雄心编辑器" `
            --icon "mascot\xuerong_face.ico" `
            --add-data "focus_editor_index.html;." `
            --add-data "mascot_face.png;." `
            --add-data "mascot_card.png;." `
            --add-data "mascot;mascot" `
            focus_editor.py
      - uses: actions/upload-artifact@v4
        with:
          name: xuerong-editor
          path: dist/*.exe
