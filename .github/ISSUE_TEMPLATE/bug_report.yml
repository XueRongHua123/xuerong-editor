name: 🐛 Bug 反馈
description: 报告编辑器报错、无法加载模组、写盘异常或进游戏检查新增报错等问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先使用编辑器内的 **「📦 导出诊断包」** 按钮（位于欢迎页底部、报错提示卡片或左侧「🩺 诊断」面板顶部）导出 `xuerong-diag.zip` 并拖入下方附件栏。
        该诊断包已自动移除本机用户名、用户主目录路径及 API 凭据，且**不包含任何 mod 脚本正文**。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 清晰描述实际发生了什么，以及原本期望的结果。
      placeholder: 例如：保存某国策后提示报错，或进游戏检查出现新增 error.log 报错……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写出触发该问题的具体操作步骤，方便定位。
      value: |
        1. 加载父 mod / 原版参考：
        2. 打开面板并执行操作：
        3. 点击保存 / 进游戏检查后出现：
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: 使用的模组与依赖情况
      description: 说明基于纯原版还是某个大型 mod 制作 Submod（可写工坊名称/ID），是否涉及多级依赖或 replace_path。
      placeholder: 例如：基于原版制作；或基于某某大型改档（工坊 ID：...）叠了一层 Submod，无 replace_path。
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 编辑器与游戏版本
      description: 填写编辑器版本（菜单栏或诊断包 summary.json 内可见）及《钢铁雄心 IV》版本。
      placeholder: "编辑器 v1.25.0 / HOI4 1.19.*"
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: 脱敏诊断包与报错截图
      description: 将导出的 `xuerong-diag.zip` 直接拖放到此输入框中上传，也可粘贴相关截图或报错文本。
    validations:
      required: false
